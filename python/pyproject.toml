[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[project]
name = "test-drive-skill"
version = "0.1.1"
description = "Helpers for the Test Drive agent skill"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Repository = "https://github.com/deyna256/test-drive"
Issues = "https://github.com/deyna256/test-drive/issues"

[project.scripts]
test-drive = "test_drive.cli:main"

[dependency-groups]
dev = ["ruff>=0.16.10", "ty>=0.0.84"]

[tool.uv.build-backend]
module-name = "test_drive"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF"]
# The formatter cannot wrap every HTML, URL, or multilingual fixture string.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Russian labels and multilingual scenarios legitimately contain non-Latin characters.
"**/test_drive/report.py" = ["RUF001"]
"**/tests/**" = ["RUF001"]
