name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.13.6'

      - name: Check tag matches package version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('python/pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          tag = os.environ['GITHUB_REF_NAME']
          if tag != f'v{version}':
              raise SystemExit(f'Tag {tag} does not match package version {version}')
          PY

      - name: Build distributions
        run: |
          uv lock --project python --check
          uv build python --no-sources --out-dir dist

      - name: Test the built wheel
        run: |
          python -m pip install --no-deps dist/*.whl
          python -B -m unittest discover -s tests -v

      - name: Upload distributions
        uses: actions/upload-artifact@v7.0.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/test-drive-skill
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8.0.2
        with:
          name: python-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
